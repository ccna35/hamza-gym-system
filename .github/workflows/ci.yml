name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gym_test
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gym -d gym_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://gym:gym_test_password@localhost:5432/gym_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Check formatting
        run: corepack pnpm format-check
      - name: Lint
        run: corepack pnpm lint
      - name: Typecheck
        run: corepack pnpm typecheck
      - name: Test
        run: corepack pnpm test
      - name: Build
        run: corepack pnpm build
