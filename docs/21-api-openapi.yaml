          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /dashboard/summary:
    get:
      tags:
      - Dashboard
      responses:
        '200':
          description: نجاح
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '401':
          description: خطأ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /dashboard/debtors:
    get:
      tags:
      - Dashboard
      parameters:
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - balance_desc
          default: balance_desc
      - $ref: '#/components/schemas/Page'
      - $ref: '#/components/schemas/Limit'
      responses:
        '200':
          description: نجاح
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtorListResponse'
        '401':
          description: خطأ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /dashboard/expiring:
    get:
      tags:
      - Dashboard
      parameters:
      - $ref: '#/components/schemas/Page'
      - $ref: '#/components/schemas/Limit'
      responses:
        '200':
          description: نجاح
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpiringListResponse'
        '401':
          description: خطأ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /audit-logs:
    get:
      tags:
      - Audit
      parameters:
      - name: entityType
        in: query
        schema:
          type: string
          enum:
          - MEMBER
          - PLAN
          - SUBSCRIPTION
          - PAYMENT
      - name: action
        in: query
        schema:
          type: string
          enum:
          - MEMBER_CREATED
          - MEMBER_UPDATED
          - MEMBER_ARCHIVED
          - MEMBER_RESTORED
          - PLAN_CREATED
          - PLAN_UPDATED
          - PLAN_ENABLED
          - PLAN_DISABLED
          - SUBSCRIPTION_CREATED
          - SUBSCRIPTION_UPDATED
          - SUBSCRIPTION_VOIDED
          - PAYMENT_CREATED
          - PAYMENT_VOIDED
      - name: entityId
        in: query
        schema:
          type: string
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      - $ref: '#/components/schemas/Page'
      - $ref: '#/components/schemas/Limit'
      responses:
        '200':
          description: نجاح
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditListResponse'
        '400':
          description: خطأ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: خطأ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /health:
    get:
      tags:
      - Health
      security: []
      responses:
        '200':
          description: نجاح
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Database/process unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: gym_session
  parameters:
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlanId:
      name: planId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required:
      - statusCode
      - code
      - message
      - details
      properties:
        statusCode:
          type: integer
        code:
          type: string
        message:
          type: string
        details:
          anyOf:
          - type: object
            additionalProperties: true
          - type: 'null'
    Pagination:
      type: object
      additionalProperties: false
      required:
      - page
      - limit
      - totalItems
      - totalPages
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    Owner:
      type: object
      additionalProperties: false
      required:
      - id
      - username
      - mustChangePassword
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        mustChangePassword:
          type: boolean
    PlanPrice:
      type: object
      additionalProperties: false
      required:
      - durationMonths
      - priceMinor
      properties:
        durationMonths:
          type: integer
          enum:
          - 1
          - 3
          - 6
          - 12
        priceMinor:
          type: integer
          minimum: 0
          description: Integer minor units; 100 = 1 EGP
    Plan:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - isEnabled
      - prices
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        isEnabled:
          type: boolean
        prices:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: '#/components/schemas/PlanPrice'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Subscription:
      type: object
      additionalProperties: false
      required:
      - id
      - memberId
      - planId
      - planNameSnapshot
      - durationMonths
      - listedPriceMinor
      - agreedPriceMinor
      - startDate
      - endDate
      - state
      - voidedAt
      - voidReason
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        planNameSnapshot:
          type: string
        durationMonths:
          type: integer
          enum:
          - 1
          - 3
          - 6
          - 12
        listedPriceMinor:
          type: integer
          minimum: 0
        agreedPriceMinor:
          type: integer
          minimum: 0
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        state:
          type: string
          enum:
          - SCHEDULED
          - ACTIVE
          - EXPIRED
          - VOIDED
        voidedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        voidReason:
          anyOf:
          - type: string
          - type: 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Payment:
      type: object
      additionalProperties: false
      required:
      - id
      - memberId
      - amountMinor
      - paymentDate
      - paymentMethod
      - receiptNumber
      - balanceAfterPaymentMinor
      - status
      - voidedAt
      - voidReason
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
        amountMinor:
          type: integer
          minimum: 1
        paymentDate:
          type: string
          format: date
        paymentMethod:
          type: string
          const: CASH
        receiptNumber:
          type: string
        balanceAfterPaymentMinor:
          type: integer
          minimum: 0
        status:
          type: string
          enum:
          - VALID
          - VOIDED
        voidedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        voidReason:
          anyOf:
          - type: string
          - type: 'null'
        createdAt:
          type: string
          format: date-time
    MemberSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - phone
      - photoUrl
      - isArchived
      - subscriptionState
      - subscriptionEndDate
      - outstandingBalanceMinor
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
        photoUrl:
          anyOf:
          - type: string
          - type: 'null'
        isArchived:
          type: boolean
        subscriptionState:
          type: string
          enum:
          - NONE
          - SCHEDULED
          - ACTIVE
          - EXPIRED
        subscriptionEndDate:
          anyOf:
          - type: string
            format: date
          - type: 'null'
        outstandingBalanceMinor:
          type: integer
          minimum: 0
    MemberDetail:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - phone
      - gender
      - dateOfBirth
      - photoUrl
      - heightCm
      - weightKg
      - joinDate
      - isArchived
      - archivedAt
      - currentSubscription
      - nextSubscription
      - outstandingBalanceMinor
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
        gender:
          type: string
          enum:
          - MALE
          - FEMALE
        dateOfBirth:
          type: string
          format: date
        photoUrl:
          anyOf:
          - type: string
          - type: 'null'
        heightCm:
          anyOf:
          - type: number
            exclusiveMinimum: 0
            maximum: 300
          - type: 'null'
        weightKg:
          anyOf:
          - type: number
            exclusiveMinimum: 0
            maximum: 500
          - type: 'null'
        joinDate:
          type: string
          format: date
        isArchived:
          type: boolean
        archivedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        currentSubscription:
          anyOf:
          - $ref: '#/components/schemas/Subscription'
          - type: 'null'
        nextSubscription:
          anyOf:
          - $ref: '#/components/schemas/Subscription'
          - type: 'null'
        outstandingBalanceMinor:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AuditLogItem:
      type: object
      additionalProperties: false
      required:
      - id
      - actorOwnerId
      - entityType
      - entityId
      - action
      - before
      - after
      - metadata
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        actorOwnerId:
          type: string
          format: uuid
        entityType:
          type: string
          enum:
          - MEMBER
          - PLAN
          - SUBSCRIPTION
          - PAYMENT
        entityId:
          type: string
        action:
          type: string
          enum:
          - MEMBER_CREATED
          - MEMBER_UPDATED
          - MEMBER_ARCHIVED
          - MEMBER_RESTORED
          - PLAN_CREATED
          - PLAN_UPDATED
          - PLAN_ENABLED
          - PLAN_DISABLED
          - SUBSCRIPTION_CREATED
          - SUBSCRIPTION_UPDATED
          - SUBSCRIPTION_VOIDED
          - PAYMENT_CREATED
          - PAYMENT_VOIDED
        before:
          anyOf:
          - type: object
            additionalProperties: true
          - type: 'null'
        after:
          anyOf:
          - type: object
            additionalProperties: true
          - type: 'null'
        metadata:
          anyOf:
          - type: object
            additionalProperties: true
          - type: 'null'
        createdAt:
          type: string
          format: date-time
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - username
      - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 1
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 10
    CreateMemberRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - phone
      - gender
      - dateOfBirth
      - joinDate
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        phone:
          type: string
        gender:
          type: string
          enum:
          - MALE
          - FEMALE
        dateOfBirth:
          type: string
          format: date
        heightCm:
          anyOf:
          - type: number
            exclusiveMinimum: 0
            maximum: 300
          - type: 'null'
        weightKg:
          anyOf:
          - type: number
            exclusiveMinimum: 0
            maximum: 500
          - type: 'null'
        joinDate:
          type: string
          format: date
    UpdateMemberRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        phone:
          type: string
        gender:
          type: string
          enum:
          - MALE
          - FEMALE
        dateOfBirth:
          type: string
          format: date
        heightCm:
          anyOf:
          - type: number
            exclusiveMinimum: 0
            maximum: 300
          - type: 'null'
        weightKg:
          anyOf:
          - type: number
            exclusiveMinimum: 0
            maximum: 500
          - type: 'null'
        joinDate:
          type: string
          format: date
    PlanMutationRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - prices
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        prices:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: '#/components/schemas/PlanPrice'
    UpdatePlanRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        prices:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: '#/components/schemas/PlanPrice'
    InitialPaymentInput:
      type: object
      additionalProperties: false
      required:
      - amountMinor
      - paymentDate
      properties:
        amountMinor:
          type: integer
          minimum: 1
        paymentDate:
          type: string
          format: date
    CreateSubscriptionRequest:
      type: object
      additionalProperties: false
      required:
      - planId
      - durationMonths
      - startDate
      - agreedPriceMinor
      properties:
        planId:
          type: string
          format: uuid
        durationMonths:
          type: integer
          enum:
          - 1
          - 3
          - 6
          - 12
        startDate:
          type: string
          format: date
        agreedPriceMinor:
          type: integer
          minimum: 0
        initialPayment:
          anyOf:
          - $ref: '#/components/schemas/InitialPaymentInput'
          - type: 'null'
    RenewSubscriptionRequest:
      type: object
      additionalProperties: false
      required:
      - planId
      - durationMonths
      - agreedPriceMinor
      properties:
        planId:
          type: string
          format: uuid
        durationMonths:
          type: integer
          enum:
          - 1
          - 3
          - 6
          - 12
        agreedPriceMinor:
          type: integer
          minimum: 0
        initialPayment:
          anyOf:
          - $ref: '#/components/schemas/InitialPaymentInput'
          - type: 'null'
    UpdateSubscriptionRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        planId:
          type: string
          format: uuid
        durationMonths:
          type: integer
          enum:
          - 1
          - 3
          - 6
          - 12
        startDate:
          type: string
          format: date
        agreedPriceMinor:
          type: integer
          minimum: 0
    VoidRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
    CreatePaymentRequest:
      type: object
      additionalProperties: false
      required:
      - amountMinor
      - paymentDate
      properties:
        amountMinor:
          type: integer
          minimum: 1
        paymentDate:
          type: string
          format: date
    OwnerResponse:
      type: object
      additionalProperties: false
      required:
      - owner
      properties:
        owner:
          $ref: '#/components/schemas/Owner'
    MemberListResponse:
      type: object
      additionalProperties: false
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MemberSummary'
        pagination:
          $ref: '#/components/schemas/Pagination'
    PlanListResponse:
      type: object
      additionalProperties: false
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Plan'
        pagination:
          $ref: '#/components/schemas/Pagination'
    SubscriptionListResponse:
      type: object
      additionalProperties: false
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Subscription'
        pagination:
          $ref: '#/components/schemas/Pagination'
    PaymentListResponse:
      type: object
      additionalProperties: false
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
        pagination:
          $ref: '#/components/schemas/Pagination'
    AuditListResponse:
      type: object
      additionalProperties: false
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogItem'
        pagination:
          $ref: '#/components/schemas/Pagination'
    SubscriptionCreateResponse:
      type: object
      additionalProperties: false
      required:
      - subscription
      - initialPayment
      - outstandingBalanceMinor
      properties:
        subscription:
          $ref: '#/components/schemas/Subscription'
        initialPayment:
          anyOf:
          - $ref: '#/components/schemas/Payment'
          - type: 'null'
        outstandingBalanceMinor:
          type: integer
          minimum: 0
    PaymentDetailResponse:
      type: object
      additionalProperties: false
      required:
      - payment
      - member
      properties:
        payment:
          $ref: '#/components/schemas/Payment'
        member:
          type: object
          additionalProperties: false
          required:
          - id
          - name
          - phone
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            phone:
              type: string
    ReceiptView:
      type: object
      additionalProperties: false
      required:
      - receiptNumber
      - status
      - member
      - amountMinor
      - paymentMethod
      - paymentDate
      - balanceAfterPaymentMinor
      - verificationCode
      - verificationUrl
      - createdAt
      properties:
        receiptNumber:
          type: string
        status:
          type: string
          enum:
          - VALID
          - VOIDED
        member:
          type: object
          additionalProperties: false
          required:
          - id
          - name
          - phone
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            phone:
              type: string
        amountMinor:
          type: integer
          minimum: 1
        paymentMethod:
          type: string
          const: CASH
        paymentDate:
          type: string
          format: date
        balanceAfterPaymentMinor:
          type: integer
          minimum: 0
        verificationCode:
          type: string
          description: Grouped display form of canonical random token
        verificationUrl:
          type: string
          format: uri
        createdAt:
          type: string
          format: date-time
    ReceiptVerification:
      type: object
      additionalProperties: false
      required:
      - status
      - receiptNumber
      - memberName
      - maskedPhone
      - amountMinor
      - paymentDate
      properties:
        status:
          type: string
          enum:
          - VALID
          - VOIDED
        receiptNumber:
          type: string
        memberName:
          type: string
        maskedPhone:
          type: string
          description: Masked Egyptian mobile number; full phone number is never public
        amountMinor:
          type: integer
          minimum: 1
        paymentDate:
          type: string
          format: date
    DashboardSummary:
      type: object
      additionalProperties: false
      required:
      - activeMembers
      - expiredMemberships
      - expiringWithin7Days
      - newMembersThisMonth
      - revenueTodayMinor
      - revenueThisMonthMinor
      - totalOutstandingDebtMinor
      properties:
        activeMembers:
          type: integer
          minimum: 0
        expiredMemberships:
          type: integer
          minimum: 0
        expiringWithin7Days:
          type: integer
          minimum: 0
        newMembersThisMonth:
          type: integer
          minimum: 0
        revenueTodayMinor:
          type: integer
          minimum: 0
        revenueThisMonthMinor:
          type: integer
          minimum: 0
        totalOutstandingDebtMinor:
          type: integer
          minimum: 0
    DebtorItem:
      type: object
      additionalProperties: false
      required:
      - memberId
      - name
      - phone
      - isArchived
      - outstandingBalanceMinor
      properties:
        memberId:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
        isArchived:
          type: boolean
        outstandingBalanceMinor:
          type: integer
          minimum: 1
    DebtorListResponse:
      type: object
      additionalProperties: false
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DebtorItem'
        pagination:
          $ref: '#/components/schemas/Pagination'
    ExpiringItem:
      type: object
      additionalProperties: false
      required:
      - memberId
      - memberName
      - phone
      - subscriptionId
      - planName
      - endDate
      - daysRemaining
      properties:
        memberId:
          type: string
          format: uuid
        memberName:
          type: string
        phone:
          type: string
        subscriptionId:
          type: string
          format: uuid
        planName:
          type: string
        endDate:
          type: string
          format: date
        daysRemaining:
          type: integer
          minimum: 0
          maximum: 7
    ExpiringListResponse:
      type: object
      additionalProperties: false
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExpiringItem'
        pagination:
          $ref: '#/components/schemas/Pagination'
    PhotoResponse:
      type: object
      additionalProperties: false
      required:
      - photoUrl
      properties:
        photoUrl:
          type: string
    HealthResponse:
      type: object
      additionalProperties: false
      required:
      - status
      - database
      properties:
        status:
          type: string
          const: ok
        database:
          type: string
          const: ok
