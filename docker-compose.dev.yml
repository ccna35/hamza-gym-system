services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gym_dev
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym_dev_password
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - gym_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gym -d gym_dev']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gym_postgres_data:
